<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Malte — Full-stack developer</title>
  <desc id="desc">A light technical banner connecting an interface, an API, and an edge device.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="0.52" stop-color="#0969DA"/>
      <stop offset="1" stop-color="#8250DF"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F6F8FA"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#57606A" stroke-width="0.6" opacity="0.11"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1F2328" flood-opacity="0.12"/>
    </filter>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="24" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="356" rx="23" fill="url(#grid)"/>
  <path d="M24 2H1176" stroke="url(#accent)" stroke-width="3" opacity="0.92"/>
  <circle cx="1138" cy="32" r="118" fill="#0969DA" opacity="0.045"/>
  <circle cx="1090" cy="320" r="150" fill="#8250DF" opacity="0.04"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(68 47)">
      <rect width="196" height="34" rx="17" fill="#FFFFFF" stroke="#D0D7DE"/>
      <circle cx="19" cy="17" r="5" fill="#0F766E" filter="url(#glow)"/>
      <text x="34" y="22" fill="#57606A" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.6">MALTE / DEVELOPER</text>
    </g>

    <text x="68" y="157" fill="#1F2328" font-size="74" font-weight="800" letter-spacing="4">MALTE</text>
    <text x="70" y="199" fill="#57606A" font-size="20" font-weight="700" letter-spacing="4.5">FULL-STACK DEVELOPER</text>
    <rect x="69" y="221" width="42" height="3" rx="1.5" fill="#0F766E"/>
    <rect x="118" y="221" width="18" height="3" rx="1.5" fill="#0969DA"/>
    <text x="69" y="256" fill="#424A53" font-size="17">Web interfaces · real-time APIs · connected systems</text>
    <text x="69" y="307" fill="#6E7781" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2">BUILD  /  SHIP  /  IMPROVE</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="730" y="45" width="402" height="270" rx="18" fill="url(#panel)" stroke="#D0D7DE"/>
    <path d="M730 82H1132" stroke="#D0D7DE"/>
    <circle cx="752" cy="64" r="4" fill="#CF222E"/>
    <circle cx="768" cy="64" r="4" fill="#BF8700"/>
    <circle cx="784" cy="64" r="4" fill="#1A7F37"/>
    <text x="812" y="68" fill="#6E7781" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1.4">SYSTEM / ONLINE</text>

    <path d="M901 135H960" stroke="url(#accent)" stroke-width="2" opacity="0.72"/>
    <path d="M835 171L893 215" stroke="url(#accent)" stroke-width="2" opacity="0.72"/>
    <path d="M1025 171L974 215" stroke="url(#accent)" stroke-width="2" opacity="0.72"/>
    <circle cx="931" cy="135" r="3" fill="#0969DA" filter="url(#glow)"/>
    <circle cx="864" cy="193" r="3" fill="#0F766E" filter="url(#glow)"/>
    <circle cx="998" cy="193" r="3" fill="#8250DF" filter="url(#glow)"/>

    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      <g transform="translate(766 103)">
        <rect width="136" height="68" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
        <rect x="13" y="13" width="24" height="4" rx="2" fill="#0F766E"/>
        <text x="13" y="40" fill="#1F2328" font-size="13" font-weight="700" letter-spacing="1.3">INTERFACE</text>
        <text x="13" y="56" fill="#6E7781" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9">REACT / TS</text>
      </g>
      <g transform="translate(960 103)">
        <rect width="136" height="68" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
        <rect x="13" y="13" width="24" height="4" rx="2" fill="#0969DA"/>
        <text x="13" y="40" fill="#1F2328" font-size="13" font-weight="700" letter-spacing="1.3">API</text>
        <text x="13" y="56" fill="#6E7781" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9">FASTAPI / WS</text>
      </g>
      <g transform="translate(863 215)">
        <rect width="136" height="68" rx="12" fill="#FFFFFF" stroke="#D0D7DE"/>
        <rect x="13" y="13" width="24" height="4" rx="2" fill="#8250DF"/>
        <text x="13" y="40" fill="#1F2328" font-size="13" font-weight="700" letter-spacing="1.3">EDGE</text>
        <text x="13" y="56" fill="#6E7781" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9">PI / DOCKER</text>
      </g>
    </g>
  </g>
</svg>
